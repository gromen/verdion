name: Deploy Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to staging.verdion.pl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/app/themes/verdion/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build theme assets
        working-directory: web/app/themes/verdion
        run: |
          npm ci
          npm run build
          npm run build:blocks

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/verdion_deploy
          chmod 600 ~/.ssh/verdion_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: vendor/bin/dep deploy staging --no-interaction -vvv
