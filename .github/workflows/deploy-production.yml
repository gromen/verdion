name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true

jobs:
  deploy:
    name: Deploy to verdion.pl
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate confirmation
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Deployment cancelled: confirmation input was not 'deploy'"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/app/themes/verdion/package-lock.json

      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --no-interaction

      - name: Build theme assets
        working-directory: web/app/themes/verdion
        run: |
          npm ci
          npm run build
          npm run build:blocks

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/verdion_deploy
          chmod 600 ~/.ssh/verdion_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: vendor/bin/dep deploy production --no-interaction -vvv
